name: Build, lint and test (data)

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-24.04"]
        python-version: ["3.10.6"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Cache build
        id: restore-build
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: build-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.sha }}-${{ matrix.os }}
          restore-keys: |
            build-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ matrix.os }}
            build-${{ env.pythonLocation }}-${{ matrix.os }}
      - name: Build package
        run: make build
      - name: Cache release
        id: restore-release
        uses: actions/cache@v4
        with:
          path: dist
          key: release-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.sha }}-${{ matrix.os }}

  lint-files:
    runs-on: ubuntu-24.04
    needs: [ build ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10.6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Cache build
        id: restore-build
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: build-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-ubuntu-24.04
      - name: Install dependencies
        run: uv sync --all-extras
      - name: check-syntax-errors
        run: make check-syntax-errors
      - name: format-style
        run: make format-style
      - name: check-style
        run: make check-style

  tests:
    runs-on: ubuntu-24.04
    needs: [ build ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10.6
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Cache build
        id: restore-build
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}
          key: build-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}-ubuntu-24.04
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Cleaning
        run: make clean
      - name: Run tests
        run: make test

